<h2 mat-dialog-title>Edit task</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="tf-form-content">
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" required autocomplete="off" />
      @if (form.controls.title.hasError('required')) {
        <mat-error>Title is required</mat-error>
      } @else if (form.controls.title.hasError('minlength')) {
        <mat-error>Title must be at least 2 characters</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="4"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Priority</mat-label>
      <mat-select formControlName="priority">
        @for (option of priorityOptions; track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Deadline</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="deadline" />
      <mat-datepicker-toggle matIconSuffix [for]="picker" />
      <mat-datepicker #picker />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="undefined">Cancel</button>
    <button mat-flat-button color="primary" type="submit">Save changes</button>
  </mat-dialog-actions>
</form>
