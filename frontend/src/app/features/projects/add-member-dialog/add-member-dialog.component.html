<h2 mat-dialog-title>Add member</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="tf-form-content">
    <mat-form-field appearance="outline">
      <mat-label>Member</mat-label>
      <input
        matInput
        [formControl]="userSearch"
        [matAutocomplete]="auto"
        placeholder="Search by name…"
        autocomplete="off"
      />
      <mat-autocomplete #auto="matAutocomplete" (optionSelected)="select($event.option.value)">
        @for (profile of candidates(); track profile.userId) {
          <mat-option [value]="profile">{{ profile.fullName }}</mat-option>
        }
      </mat-autocomplete>
      @if (form.controls.user.invalid && form.controls.user.touched) {
        <mat-error>Pick someone from the list</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Role</mat-label>
      <mat-select [formControl]="role">
        <mat-option value="member">Member</mat-option>
        <mat-option value="admin">Admin</mat-option>
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="undefined">Cancel</button>
    <button mat-flat-button color="primary" type="submit">Add member</button>
  </mat-dialog-actions>
</form>
