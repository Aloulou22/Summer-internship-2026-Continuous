<h2 mat-dialog-title>{{ data.mode === 'create' ? 'New team' : 'Edit team' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="tf-form-content">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required autocomplete="off" />
      @if (form.controls.name.hasError('required')) {
        <mat-error>Name is required</mat-error>
      } @else if (form.controls.name.hasError('minlength')) {
        <mat-error>Name must be at least 2 characters</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="undefined">Cancel</button>
    <button mat-flat-button color="primary" type="submit">
      {{ data.mode === 'create' ? 'Create team' : 'Save changes' }}
    </button>
  </mat-dialog-actions>
</form>
