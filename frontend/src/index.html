  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap"
    rel="stylesheet">
  <!-- Icons: a single fixed instance (opsz 24, wght 400, FILL 0, GRAD 0) —
       exactly what .material-symbols-outlined sets in styles.scss. Requesting
       the full variable axis ranges downloads ~2.3 MB instead of ~0.3 MB.
       display=block so ligature names ("dashboard") never flash as text. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block"
    rel="stylesheet">
</head>
