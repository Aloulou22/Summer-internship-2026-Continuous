name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.backend-filter.outputs.changes }}
      frontend: ${{ steps.frontend-filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: backend-filter
        with:
          filters: |
            api-gateway: 'services/api-gateway/**'
            auth-service: 'services/auth-service/**'
            user-service: 'services/user-service/**'
            project-service: 'services/project-service/**'
            task-service: 'services/task-service/**'
            notification-service: 'services/notification-service/**'

      - uses: dorny/paths-filter@v3
        id: frontend-filter
        with:
          filters: |
            frontend: 'frontend/**'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.backend) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Build
        working-directory: services/${{ matrix.service }}
        run: npm run build

      # Railway builds each service straight from this Dockerfile, so a build
      # failure here means the deploy would fail too — catch it in CI instead.
      - name: Docker build check
        run: docker build -t taskflow/${{ matrix.service }}:ci services/${{ matrix.service }}

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless
